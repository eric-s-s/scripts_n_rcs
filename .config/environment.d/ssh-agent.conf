# ~/.config/environment.d/ssh-agent.conf
#
# Points every program in the graphical session at the ssh-agent socket
# created by ~/.config/systemd/user/ssh-agent.service.
#
# systemd reads every *.conf file in this directory at login, so the name is
# only for humans. Changes take effect at the next login. This replaces the
# `export SSH_AUTH_SOCK=...` line in ~/.bashrc.
SSH_AUTH_SOCK=${XDG_RUNTIME_DIR}/ssh-agent.socket
